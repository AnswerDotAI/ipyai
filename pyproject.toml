[build-system]
requires = ["maturin>=1.13,<2.0", "fastws-cli>=0.0.39"]
build-backend = "fastws.build_backend"

[project]
name = "ipyai"
dynamic = ["version"]
description = "Terminal IPython with an AI assistant on the same transcript"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "info@answer.ai"}]
dependencies = []

[project.urls]
Source = "https://github.com/answerdotai/ipyai"

[project.optional-dependencies]
dev = ["fastws-cli>=0.0.39", "rustygate>=0.1.54", "jupyasyncclient>=0.2.32", "ipymini>=0.1.30", "httpx", "websockets", "fastmux", "pytest", "pyghostty"]

[tool.maturin]
bindings = "bin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.fastship]
