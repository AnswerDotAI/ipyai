[package]
name = "ipyai"
version = "0.1.13"
edition = "2024"
description = "Terminal IPython and AI on a shared Rustygate notebook"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ipyai"
test = false

[dependencies]
aihist = "0.1.11"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
jiff = "0.2"
mdhtml2term = "0.1.4"
regex = "1"
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teleprint = { version = "0.1.6", features = ["tty"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "io-std", "io-util", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.ipyai]
incremental = true

[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
strip = true

[profile.dist.package.ipyai]
incremental = false
