name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/workflows/setup-uv@master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tmux ed
      - run: cargo test --release
      - run: uv pip install --system --config-settings-package ipyai:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: pytest -q

  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: AnswerDotAI/workflows/maturin-build@master
        with:
          args: --profile dist --out dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
